<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LINE売上分析アプリ (Lite版)</title>
    
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="apple-touch-icon" href="favicon.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"></script>
    <style>
        /* 背景はクリーンな白固定 */
        body { background-color: #ffffff; font-family: sans-serif; }
        .chart-container { position: relative; height: 250px; width: 100%; }
        .monthly-chart-container { position: relative; height: 350px; width: 100%; }
        @media (min-width: 768px) { 
            .chart-container { height: 300px; } 
            .monthly-chart-container { height: 400px; }
        }
    </style>
</head>
<body class="text-gray-800 pb-4">

    <header class="bg-[#00C300] text-white shadow-md sticky top-0 z-10">
        <div class="max-w-6xl mx-auto flex items-center justify-between px-4">
            <div class="flex items-center">
                <img src="top-left.png" alt="シーサーアイコン" class="h-16 w-auto block object-contain">
                <h1 class="text-lg md:text-xl font-bold ml-3 py-4">LINE Sales Analytics (Lite)</h1>
            </div>
            <a href="https://aalinezipmaker.netlify.app/" target="_blank" rel="noopener noreferrer" class="text-xs md:text-sm font-bold text-white hover:text-green-100 transition">
                🔗スタンプ/絵文字 ZIPメーカー
            </a>
        </div>
    </header>
    
    <main class="p-4 max-w-6xl mx-auto space-y-6">
        
        <div class="bg-white p-4 md:p-6 rounded-xl shadow-sm border border-gray-200">
            <div class="flex flex-col gap-6">
                <div>
                    <label class="block mb-2 text-sm font-bold text-gray-700">1. CSVファイルを一括選択 (最大6ヶ月分):</label>
                    <input type="file" id="csvFileInput" multiple accept=".csv" class="block w-full text-sm text-gray-500
                        file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0
                        file:text-sm file:font-bold file:bg-green-50 file:text-[#00C300]
                        hover:file:bg-green-100 cursor-pointer transition" />
                </div>
                
                <div>
                    <label class="block mb-2 text-sm font-bold text-gray-700">2. 表示する月を選択 (複数選択可):</label>
                    <div id="monthFilterContainer" class="flex flex-wrap gap-2">
                        <span class="text-sm text-gray-400">※CSVを読み込むとここに月ボタンが表示されます</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="grid grid-cols-2 md:grid-cols-3 gap-3 md:gap-4">
            <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200 border-l-4 border-l-[#00C300]">
                <p class="text-xs text-gray-500 font-bold">総収益 (円)</p>
                <p class="text-xl md:text-2xl font-black text-gray-800 mt-1" id="kpiRevenue">¥0</p>
            </div>
            <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200 border-l-4 border-l-green-500">
                <p class="text-xs text-gray-500 font-bold">総販売数 (件)</p>
                <p class="text-xl md:text-2xl font-black text-gray-800 mt-1" id="kpiSalesCount">0</p>
            </div>
            <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200 border-l-4 border-l-yellow-500 col-span-2 md:col-span-1">
                <p class="text-xs text-gray-500 font-bold">No.1 売上アイテム</p>
                <p class="text-sm md:text-base font-bold text-gray-800 mt-1 truncate" id="kpiTopItem">-</p>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-4 md:gap-6">
            
            <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200 lg:col-span-2">
                <div class="flex justify-between items-center border-b pb-2 mb-4">
                    <h2 class="text-sm md:text-base font-bold text-gray-700">📅 月別収益推移</h2>
                    <div class="flex items-center gap-3">
                        <button onclick="downloadChart('monthlyChart', '月別収益推移')" class="text-xs font-bold text-[#00C300] hover:text-[#009900] flex items-center gap-1 active:scale-95 transition">
                            📥 画像保存
                        </button>
                        <select id="monthlyCategorySelect" class="p-1.5 border border-gray-300 rounded-lg bg-gray-50 text-xs font-bold text-gray-700 cursor-pointer focus:ring-[#00C300] focus:border-[#00C300]">
                            <option value="ALL">すべてのカテゴリ (積み上げ)</option>
                        </select>
                    </div>
                </div>
                <div class="monthly-chart-container"><canvas id="monthlyChart"></canvas></div>
            </div>

            <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200">
                <div class="flex justify-between items-center border-b pb-2 mb-4">
                    <h2 class="text-sm md:text-base font-bold text-gray-700">🎨 種類シェア</h2>
                    <button onclick="downloadChart('typeChart', '種類別シェア')" class="text-xs font-bold text-[#00C300] hover:text-[#009900] active:scale-95 transition">
                        📥 保存
                    </button>
                </div>
                <div class="chart-container"><canvas id="typeChart"></canvas></div>
            </div>
            
            <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200">
                <div class="flex justify-between items-center border-b pb-2 mb-4">
                    <h2 class="text-sm md:text-base font-bold text-gray-700">📊 カテゴリ別 総売上比較</h2>
                    <button onclick="downloadChart('categorySummaryChart', 'カテゴリ別総売上比較')" class="text-xs font-bold text-[#00C300] hover:text-[#009900] flex items-center gap-1 active:scale-95 transition">
                        📥 画像保存
                    </button>
                </div>
                <div class="chart-container" style="height: 180px;"><canvas id="categorySummaryChart"></canvas></div>
            </div>
            
            <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200 lg:col-span-2">
                <div class="flex justify-between items-center border-b pb-2 mb-4">
                    <h2 class="text-sm md:text-base font-bold text-gray-700" id="categoryRankChartTitle">🏆 カテゴリ別 売上ランキング (Top 5)</h2>
                    <div class="flex items-center gap-3">
                        <button onclick="downloadChart('categoryRankChart', 'カテゴリ別売上ランキング_' + document.getElementById('categoryRankSelect').value)" class="text-xs font-bold text-[#00C300] hover:text-[#009900] flex items-center gap-1 active:scale-95 transition">
                            📥 画像保存
                        </button>
                        <select id="categoryRankSelect" class="p-1.5 border border-gray-300 rounded-lg bg-gray-50 text-xs font-bold text-gray-700 cursor-pointer focus:ring-[#00C300] focus:border-[#00C300]">
                        </select>
                    </div>
                </div>
                <div class="chart-container"><canvas id="categoryRankChart"></canvas></div>
            </div>

            <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200">
                <div class="flex justify-between items-center border-b pb-2 mb-4">
                    <h2 class="text-sm md:text-base font-bold text-gray-700">👑 全体収益ランキング (Top 5)</h2>
                    <button onclick="downloadChart('itemChart', '全体収益ランキング')" class="text-xs font-bold text-[#00C300] hover:text-[#009900] flex items-center gap-1 active:scale-95 transition">
                        📥 画像保存
                    </button>
                </div>
                <div class="chart-container"><canvas id="itemChart"></canvas></div>
            </div>

            <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200">
                <div class="flex justify-between items-center border-b pb-2 mb-4">
                    <h2 class="text-sm md:text-base font-bold text-gray-700">🛍️ 全体販売数ランキング (Top 5)</h2>
                    <button onclick="downloadChart('salesCountChart', '全体販売数ランキング')" class="text-xs font-bold text-[#00C300] hover:text-[#009900] flex items-center gap-1 active:scale-95 transition">
                        📥 画像保存
                    </button>
                </div>
                <div class="chart-container"><canvas id="salesCountChart"></canvas></div>
            </div>

        </div>

    </main>

    <footer class="max-w-6xl mx-auto px-4 py-6 text-xs text-gray-400 border-t border-gray-100 mt-12 flex flex-col sm:flex-row justify-end items-center sm:items-end gap-2">
        <p class="leading-none pb-0.5">© 2026 <a href="https://store.line.me/search/ja?q=arakakiai" target="_blank" rel="noopener noreferrer" class="text-[#00C300] hover:text-[#009900] transition font-bold">ARAKAKIAIworks</a>. All Rights Reserved.</p>
        <img src="bottom-right.png" alt="シーサーロゴ" class="h-9 w-auto object-contain block">
    </footer>
